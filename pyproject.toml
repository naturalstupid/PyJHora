[build-system]
requires = ["setuptools>=63.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PyJHora"
description = "Complete Vedic Astrology Python package and SarvaJyotish Web Service."
version = "5.0.6"
authors = [
	{name="Sundar Sundaresan",email = "carnaticmusicguru2015@comcast.net"},
]
readme = "README.md"
requires-python = ">=3.10"
keywords = ["Vedic Astrology", "Astrology", "Hindu Astrology", "Kundali", "Panchang", "Horoscope", "Hora", "JHora"]

# PEP 639 modern fields replacing license = {file="LICENSE"}
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]

classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Other Audience",
    "Topic :: Scientific/Engineering :: Astronomy",
    # Legacy "License :: ..." classifiers are removed completely
]

dependencies = [
    "geocoder==1.38.1",
    "geopy==2.4.1",
    "img2pdf==0.5.1",
    "numpy==2.1.1",
    "PyQt6==6.7.1",
    "pyqtgraph==0.13.7",
    "pytz==2024.1",
    "requests>=2.32.3",
    "setuptools>=69.5.1",
    "pyswisseph==2.10.3.2",
    "timezonefinder==6.5.2",
    "reverse_geocode==1.6.6",
    "python-dateutil>=2.9.0.post0",
]

[project.urls]
homepage = "https://github.com/naturalstupid/pyjhora"
repository = "https://github.com/naturalstupid/pyjhora"
Issues = "https://github.com/naturalstupid/pyjhora/issues"

[tool.setuptools.package-data]
"jhora.lang" = ["*"]
"jhora.images" = ["*"]
"jhora.tests" = ["*"]
"*" = ["*.txt", "*.csv","*.md", "*.json", "*.xlsx", "*.mkb", "*.vkb", "*.db"]
